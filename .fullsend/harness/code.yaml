# .fullsend/harness/code.yaml
#
# Composes the upstream fullsend code harness (pinned to agents v0.38.0) and
# adds the local dispatch trigger. The upstream base handles forge-specific
# credentials and network access via provider-backed overlays (ADR 0065),
# selecting GitHub, GitLab, or Jira config based on event.source.system /
# runtime.forge. Only CODE_ALLOWED_TARGET_BRANCHES is overridden here because
# osdctl uses master, not main.
base: https://raw.githubusercontent.com/fullsend-ai/agents/7ab05564b3c9c0ab20197e0c8572b5905ffd75ca/harness/code.yaml#sha256=d10044d419789b3b965490a20f3ee58640e8fe3c708afc62b3b7abb3b89224a3

trigger: >
  event.entity.kind == "work_item"
    && (
      (event.transition.kind == "comment_added"
        && has(event.transition.comment.command)
        && event.transition.comment.command == "/fs-code")
      ||
      (event.transition.kind == "label_changed"
        && event.transition.label.name == "ready-to-code"
        && event.transition.label.action == "added")
    )

allowed_remote_resources: [https://raw.githubusercontent.com/fullsend-ai/agents/]

env:
  runner:
    CODE_ALLOWED_TARGET_BRANCHES: master
  sandbox:
    CODE_ALLOWED_TARGET_BRANCHES: master
