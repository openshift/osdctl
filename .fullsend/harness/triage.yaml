# .fullsend/harness/triage.yaml
#
# Composes the upstream fullsend triage harness (pinned to agents v0.38.0) and
# adds the local dispatch trigger. The upstream base handles forge-specific
# credentials and network access via provider-backed overlays (ADR 0065),
# selecting GitHub or Jira config based on event.source.system.
base: https://raw.githubusercontent.com/fullsend-ai/agents/7ab05564b3c9c0ab20197e0c8572b5905ffd75ca/harness/triage.yaml#sha256=3aa32e9f66ad6a9b60a75f50d3adc6ae39ebfb425c3928381e019436498bf2aa

trigger: >
  event.entity.kind == "work_item"
    && event.transition.kind == "comment_added"
    && has(event.transition.comment.command)
    && event.transition.comment.command == "/fs-triage"

allowed_remote_resources: [https://raw.githubusercontent.com/fullsend-ai/agents/]
